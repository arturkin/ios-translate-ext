<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Translate Icelandic</title>
  <meta name="description" content="A Safari extension that translates Icelandic web pages to English and looks up Icelandic words.">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 640px; margin: 0 auto; padding: 4rem 1.25rem;
      color: #1d1d1f; background: #fff; text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      body { color: #f5f5f7; background: #1c1c1e; }
      a.btn { background: #2c2c2e; border-color: #3a3a3c; color: #f5f5f7; }
    }
    h1 { font-size: 2.4rem; letter-spacing: -.02em; margin: 0 0 .25rem; }
    .flag { font-size: 3.5rem; line-height: 1; margin-bottom: 1rem; }
    p { font-size: 1.15rem; color: #6e6e73; }
    @media (prefers-color-scheme: dark) { p { color: #a1a1a6; } }
    .links { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; margin-top: 2rem; }
    a.btn {
      display: inline-block; padding: .7rem 1.4rem; border-radius: 12px;
      border: 1px solid #d2d2d7; background: #f5f5f7; color: #0066cc;
      font-weight: 600; text-decoration: none;
    }
    a.btn:hover { border-color: #0066cc; }
    footer { margin-top: 3rem; color: #86868b; font-size: .85rem; }
    footer a { color: inherit; }
    .reveal-email { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="flag">🇮🇸</div>
  <h1>Translate Icelandic</h1>
  <p>A Safari extension that translates Icelandic web pages to English and lets you look up Icelandic words — meanings, a dictionary link, and full inflection tables.</p>

  <div class="links">
    <a class="btn" href="./support.html">Support &amp; FAQ</a>
    <a class="btn" href="./privacy.html">Privacy Policy</a>
  </div>

  <footer>
    Questions? <button type="button" class="reveal-email" data-e="YXJ0dXJAdHJhdmVsc2hpZnQuY29t">show email address</button>
  </footer>

  <script>
    document.querySelectorAll(".reveal-email").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var email = atob(btn.getAttribute("data-e"));
        var subj = btn.getAttribute("data-s");
        var a = document.createElement("a");
        a.href = "mailto:" + email + (subj ? "?subject=" + subj : "");
        a.textContent = email;
        btn.replaceWith(a);
      });
    });
  </script>
</body>
</html>
